name: Build Clippie Installer

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyqt6

      - name: Build .exe with PyInstaller
        run: |
          pyinstaller --onefile --windowed --icon=assets\clippie.ico main.py

      - name: Install Inno Setup silently
        run: |
          Invoke-WebRequest "https://jrsoftware.org/download.php/is6install.exe" -OutFile "is6install.exe"
          Start-Process -FilePath "is6install.exe" -ArgumentList "/VERYSILENT /NORESTART /SP-" -Wait

      - name: Build installer with Inno Setup
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" Clippie.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v3
        with:
          name: Clippie-Installer
          path: Output\ClippieInstaller.exe
