name: Build Clippie EXE

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    env:
      # Force Node.js 24 for all actions
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # 1️⃣ Checkout your repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set up Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11  # or your version

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4️⃣ Build .exe using PyInstaller
      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed main.py
          # Replace main.py with your entry point

      # 5️⃣ Optional: Install Inno Setup
      - name: Install Inno Setup
        uses: jupytercaleb/innosetup-action@v1.0.1
        with:
          version: 6.2.0  # latest stable

      # 6️⃣ Optional: Package EXE using Inno Setup
      - name: Create Installer
        run: |
          iscc installer.iss
          # Make sure installer.iss points to your EXE built above

      # 7️⃣ Upload the EXE/Installer as an artifact
      - name: Upload EXE
        uses: actions/upload-artifact@v3
        with:
          name: Clippie-Build
          path: |
            dist/*.exe
            # or path/to/installer/setup.exe
