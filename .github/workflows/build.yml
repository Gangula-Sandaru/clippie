name: Build Clippie Installer

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    # Force Node.js 24 for all actions in this job
    defaults:
      run:
        shell: pwsh
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHON_VERSION: '3.11'

    steps:
      # 1. Checkout code (with Node 24 forced)
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # 3. Install dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyqt6

      # 4. Build .exe with PyInstaller
      - name: Build Clippie .exe
        run: |
          pyinstaller --onefile --windowed --icon=assets\clippie.ico main.py
          echo "Executable built at dist\main.exe"

      # 5. Install Inno Setup silently
      - name: Install Inno Setup
        run: |
          Invoke-WebRequest "https://jrsoftware.org/download.php/is6install.exe" -OutFile "is6install.exe"
          Start-Process -FilePath "is6install.exe" -ArgumentList "/VERYSILENT /NORESTART /SP-" -Wait

      # 6. Build installer with Inno Setup
      - name: Build Installer
        run: |
          $sha = git rev-parse --short HEAD
          $installerName = "ClippieInstaller-$sha.exe"
          (Get-Content Clippie.iss) -replace "OutputFileName=.*", "OutputFileName=Output\\$installerName" | Set-Content Clippie.iss
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" Clippie.iss
          echo "Installer built: Output\$installerName"

      # 7. Upload artifact
      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: Clippie-Installer
          path: Output\*.exe
