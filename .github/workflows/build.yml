name: Build Clippie EXE

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Checkout repository (Updated to v4)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python (Updated to v5)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Matches your local 3.10.dll version

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt5 pyperclip # Add all your project libraries here

      # 4. Build .exe using PyInstaller
      # Note: Make sure to include your --add-data flags so themes/ui folders are included!
      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "Clippie" --add-data "assets;assets" --add-data "themes;themes" --add-data "ui;ui" --add-data "db;db" main.py

      # 5. Create Installer using Inno Setup
      # We use 'iscc' directly because it is already installed on Windows Runners
      - name: Create Installer
        run: |
          iscc clippie.iss 
        # Ensure 'clippie.iss' is in your GitHub root folder

      # 6. Upload the Installer as an artifact (Updated to v4)
      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: Clippie-Installation-Package
          path: Output/*.exe 
          # Inno Setup usually puts the result in an 'Output' folder
