name: Build and Release Clippie

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Enter the version (e.g., v1.0.0)"
        required: true

# 🔑 THIS SECTION FIXES THE "RESOURCE NOT ACCESSIBLE" ERROR
permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Quiets the warnings

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt5 pyperclip
          # Add any other libraries from your requirements.txt here

      - name: Build Executable (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "clippie-windows" --add-data "assets;assets" --add-data "themes;themes" --add-data "ui;ui" --add-data "db;db" main.py

      - name: Build Executable (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "clippie-${{ matrix.os == 'ubuntu-latest' && 'linux' || 'macos' }}" --add-data "assets:assets" --add-data "themes:themes" --add-data "ui:ui" --add-data "db:db" main.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clippie-${{ matrix.os }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloads
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          files: |
            ./downloads/clippie-windows.exe
            ./downloads/clippie-linux
            ./downloads/clippie-macos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
