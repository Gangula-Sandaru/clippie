name: Build Clippie EXE

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    
    # 🛠️ THIS FIXES THE DEPRECATION WARNING
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Ensure this is v4

      - name: Setup Python
        uses: actions/setup-python@v5 # Ensure this is v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt5 pyperclip

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "Clippie" --add-data "assets;assets" --add-data "themes;themes" --add-data "ui;ui" --add-data "db;db" main.py

      - name: Create Installer
        run: |
          iscc clippie.iss

      - name: Upload Installer
        uses: actions/upload-artifact@v4 # Ensure this is v4
        with:
          name: Clippie-Installation-Package
          path: Output/*.exe
